name: Momentum watchlist robot

on:
  schedule:
    # Sun-Thu evenings Pacific (the nights before each trading day).
    # 01:45 UTC = 5:45 PM PST, 04:45 UTC = 8:45 PM PST (an hour later during daylight time)
    - cron: "45 1 * * 1-5"
    - cron: "45 4 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watchlist
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr ffmpeg
          pip install -q -U yt-dlp faster-whisper pillow

      - name: Read the newest reel
        run: python robot.py

      - name: Save results
        run: |
          git config user.name "momentum-robot"
          git config user.email "momentum-robot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Watchlist $(date -u +%F)"
          git push
